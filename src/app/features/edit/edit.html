<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-content-container">
        <mat-form-field>
            <mat-label>Título</mat-label>
            <input type="text" matInput formControlName="title" placeholder="Título" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Descrição</mat-label>
            <input type="text" matInput formControlName="description" placeholder="Descrição" />
        </mat-form-field>
        <button type="submit" mat-raised-button color="primary">Salvar</button>
    </div>
</form>

<div class="action-container">
    <a matButton="outlined" [routerLink]="['create-product']" color="primary">Criar produto</a>
</div>

@for (product of products(); track product.id) {
    @defer (on immediate) {
        <app-card [product]="product" (edit)="onEdit(product.id)" (delete)="onDelete(product.id)"></app-card>
    }
}
@empty {
    @defer (on immediate) {
        <app-no-items></app-no-items>
    }
}
